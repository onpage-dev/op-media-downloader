name: Build and Release OP Media Downloader

on:
  release:
    types: [created]

permissions:
  contents: write

env:
  # Font Awesome Pro (icons of the On Page design system): the token lives in the repository secrets
  FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Font Awesome registry token
        shell: bash
        run: echo "//npm.fontawesome.com/:_authToken=${FONTAWESOME_NPM_AUTH_TOKEN}" >> .npmrc

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Test
        run: yarn test

      - name: Build for Windows
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn run build:win

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: op-media-downloader-windows
          path: dist/*.exe

  build-mac:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    env:
      CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Font Awesome registry token
        shell: bash
        run: echo "//npm.fontawesome.com/:_authToken=${FONTAWESOME_NPM_AUTH_TOKEN}" >> .npmrc

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Prepare signing certificate
        env:
          CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
        run: |
          echo "$CERTIFICATE" | base64 --decode > certificate.p12

      - name: Configure macOS keychain for signing
        run: |
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: Build and sign for macOS
        env:
          ARCH: ${{ matrix.arch }}
          CSC_LINK: certificate.p12
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Building for architecture: $ARCH"
          yarn run build:mac

      - name: Notarize and validate App
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          dmg_file=$(find dist -name "*.dmg" | head -n 1)
          if [ -z "$dmg_file" ]; then
            echo "Error: No .dmg file found."
            exit 1
          fi
          xcrun notarytool store-credentials "AC_PASSWORD" --apple-id "$APPLE_ID" --password "$APPLE_ID_PASSWORD" --team-id "$TEAM_ID"
          xcrun notarytool submit "$dmg_file" --keychain-profile "AC_PASSWORD" --wait
          xcrun stapler staple "$dmg_file"
          spctl -a -vvv -t install "$dmg_file"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: op-media-downloader-mac-${{ matrix.arch }}
          path: dist/*.dmg

  release:
    needs:
      - build-windows
      - build-mac
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Upload assets to the release that started the workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" \
            release/op-media-downloader-windows/*.exe \
            release/op-media-downloader-mac-x64/*.dmg \
            release/op-media-downloader-mac-arm64/*.dmg \
            --clobber
