name: Release

# Push a tag `vX.Y.Z` (the version of package.json and of the Cargo workspace):
# the installers are built, attached to a draft release with their checksums
# and provenance, and the release is published last, so the in-app update
# check never points at a release without installers. A version with a hyphen
# (3.1.0-beta.1) becomes a prerelease, which the update check skips. The builds
# restore no dependency cache: a cache saved by another run must never end up
# in an installer.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LINUX_DEPS: >-
    build-essential pkg-config libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev
    librsvg2-dev libdbus-1-dev patchelf file

jobs:
  # The update check compares the tag with the version the app reports, the one of the Cargo workspace: they must match
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The tag is the version of package.json and of the app
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node_version=$(node -p "require('./package.json').version")
          app_version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$TAG" != "v$node_version" ] || [ "$TAG" != "v$app_version" ]; then
            echo "::error::The tag $TAG is not v$node_version (package.json) and v$app_version (Cargo.toml)"
            exit 1
          fi

  build-windows:
    needs: version
    runs-on: windows-latest
    # The slowest system: the tests, then the app and opmd with the release profile (fat LTO, one codegen unit)
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Font Awesome Pro icons (a release must have them)
        env:
          FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}
        run: node scripts/pro-icons.mjs --required

      - name: Test
        run: |
          yarn test
          cargo test --workspace --locked

      # Not code-signed yet: Windows shows "unknown publisher" until a certificate is set up. The installer carries
      # opmd (built before the bundle) and puts it on the user's PATH; opmd alone is attached too, for servers
      - name: Build for Windows
        shell: bash
        run: |
          node scripts/notices.mjs
          yarn tauri build --ci --config src-tauri/tauri.bundle.conf.json
          version=$(node -p "require('./package.json').version")
          mkdir dist-release
          cp target/release/bundle/nsis/*-setup.exe "dist-release/op-media-downloader-$version-x64-setup.exe"
          7z a "dist-release/opmd-$version-windows-x64.zip" ./target/release/opmd.exe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            dist-release/*.exe
            dist-release/*.zip
          if-no-files-found: error

  build-mac:
    needs: version
    runs-on: macos-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-apple-darwin
          - arch: arm64
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Rust toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET"
          rustup default stable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Font Awesome Pro icons (a release must have them)
        env:
          FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}
        run: node scripts/pro-icons.mjs --required

      # As in 1.x and 2.0, the certificate (base64 in MAC_CERTIFICATE) goes into a keychain of the build's own (Tauri
      # imports it); the identity is the one of the certificate, the build stops when it cannot sign
      - name: Build and sign for macOS
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
          APPLE_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: 'Dinside s.r.l.'
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::error::MAC_CERTIFICATE is missing: a release must be signed"
            exit 1
          fi
          node scripts/notices.mjs
          yarn tauri build --ci --config src-tauri/tauri.bundle.conf.json --target "$TARGET"
          version=$(node -p "require('./package.json').version")
          mkdir dist-release
          cp target/$TARGET/release/bundle/dmg/*.dmg "dist-release/op-media-downloader-$version-$ARCH.dmg"
          codesign --verify --deep --strict "target/$TARGET/release/bundle/macos/On Page Media Downloader.app"

      - name: Notarize and validate
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          dmg_file=$(find dist-release -name "*.dmg" | head -n 1)
          if [ -z "$dmg_file" ]; then
            echo "Error: no .dmg file found."
            exit 1
          fi
          xcrun notarytool submit "$dmg_file" --apple-id "$APPLE_ID" --password "$APPLE_ID_PASSWORD" --team-id "$TEAM_ID" --wait
          xcrun stapler staple "$dmg_file"
          spctl -a -vvv -t install "$dmg_file"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-${{ matrix.arch }}
          path: dist-release/*.dmg
          if-no-files-found: error

  build-linux:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Linux libraries
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Font Awesome Pro icons (a release must have them)
        env:
          FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}
        run: node scripts/pro-icons.mjs --required

      # The .deb installs opmd in /usr/bin; opmd alone is attached too, for servers without a desktop
      - name: Build for Linux
        run: |
          node scripts/notices.mjs
          yarn tauri build --ci --config src-tauri/tauri.bundle.conf.json
          version=$(node -p "require('./package.json').version")
          mkdir dist-release
          cp target/release/bundle/appimage/*.AppImage "dist-release/op-media-downloader-$version-x86_64.AppImage"
          cp target/release/bundle/deb/*.deb "dist-release/op-media-downloader-$version-amd64.deb"
          tar -czf "dist-release/opmd-$version-linux-x86_64.tar.gz" -C target/release opmd

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: |
            dist-release/*.AppImage
            dist-release/*.deb
            dist-release/*.tar.gz
          if-no-files-found: error

  release:
    needs: [build-windows, build-mac, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true

      - name: Checksums
        working-directory: assets
        run: sha256sum * > SHA256SUMS.txt

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'assets/*'

      - name: Draft release with the installers, then publish it
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=false
          case "$TAG" in *-*) prerelease=true ;; esac
          gh release create "$TAG" assets/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes \
            --draft --prerelease="$prerelease"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
