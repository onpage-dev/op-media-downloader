name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: yarn

      # With the secret the install generates the Pro light icons of the design system; forks build with Font Awesome Free
      - name: Install dependencies
        env:
          FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}
        run: yarn install --frozen-lockfile

      # Once, on Linux: the advisories are the same everywhere. Whatever --level says, Yarn 1 adds 1, 2, 4, 8 and 16 to
      # its exit code for info, low, moderate, high and critical advisories, and exits with 1 when the audit fails
      - name: Known vulnerabilities in the app's dependencies
        if: runner.os == 'Linux'
        run: |
          status=0
          yarn audit --groups dependencies --level high || status=$?
          [ "$status" -ne 1 ] && [ "$status" -lt 8 ]

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Formatting
        run: yarn format:check

      - name: Test
        run: yarn test

      - name: Build
        run: yarn run build

      # bash on every system: PowerShell, the Windows default, splits `-c.mac.identity=null` at the dot
      - name: Package (unsigned, not published)
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --dir --publish never -c.mac.identity=null
