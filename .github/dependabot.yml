# Security fixes only: when a dependency has a known vulnerability, Dependabot
# opens a pull request with the fixes, one per ecosystem. No routine version
# updates (`open-pull-requests-limit: 0` stops those and leaves security updates
# alone): they are done by hand, all together and checked on every system first,
# since majors such as TypeScript 7 (no JavaScript API for vue-tsc) or the
# RustCrypto crates of os_crypt need code changes.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
