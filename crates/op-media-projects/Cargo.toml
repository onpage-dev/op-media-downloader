[package]
name = "op-media-projects"
description = "The projects of On Page Media Downloader as the app, the opmd command and the MCP server share them: settings file, tokens, project operations"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
op-media-service.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
chrono.workspace = true
uuid.workspace = true
parking_lot.workspace = true
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
dirs = "6"
base64 = "0.22"
regex = "1"
aes = "0.8"
aes-gcm = "0.10"
cbc = "0.1"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
sha1 = "0.10"
url = "2"
tokio-util.workspace = true
rmcp = { version = "3.9", default-features = false, features = ["server", "client", "macros", "transport-io", "transport-streamable-http-server", "transport-streamable-http-client-reqwest", "reqwest"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
tempfile = "3"
op-media-service = { workspace = true, features = ["fake-server"] }
