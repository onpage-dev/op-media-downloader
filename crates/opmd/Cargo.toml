[package]
name = "opmd"
description = "On Page Media Downloader from the terminal and for AI agents (MCP): everything the app does with its projects, with or without the app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
op-media-projects.workspace = true
op-media-service.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal", "process"] }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
rpassword = "7"
sys-locale = "0.3"

[dev-dependencies]
op-media-service = { workspace = true, features = ["fake-server"] }
tempfile = "3"
