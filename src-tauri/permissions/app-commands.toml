# Every command of window.desktop, granted to the app's own windows by capabilities/app.json
[[set]]
identifier = "allow-app-commands"
description = "The commands of window.desktop: projects, sync, folders, tokens, settings, app, window"
permissions = [
  "allow-projects-list",
  "allow-projects-create",
  "allow-projects-update",
  "allow-projects-remove",
  "allow-projects-reveal-token",
  "allow-sync-sync",
  "allow-sync-sync-all",
  "allow-sync-download",
  "allow-sync-retry-failed",
  "allow-sync-confirm-cleanup",
  "allow-sync-stop",
  "allow-sync-get-activity",
  "allow-sync-get-failed",
  "allow-sync-get-duplicates",
  "allow-folders-pick",
  "allow-folders-inspect",
  "allow-folders-open-project",
  "allow-tokens-verify",
  "allow-tokens-verify-project",
  "allow-settings-get",
  "allow-settings-set",
  "allow-app-version",
  "allow-app-check-for-updates",
  "allow-app-status",
  "allow-app-open-external",
  "allow-app-copy-text",
  "allow-app-open-licenses",
  "allow-app-take-commands",
  "allow-app-log",
  "allow-app-show-main-window",
  "allow-app-quit",
  "allow-window-minimize",
  "allow-window-toggle-maximize",
  "allow-window-close",
]
