appId: com.onpage.mediadownloader
productName: On Page Media Downloader
directories:
  buildResources: build
files:
  - 'out/**'
  - 'package.json'
  - '!**/*.map'
asarUnpack:
  - '**/*.{node,dll}'
# Generated by `yarn build` (scripts/notices.mjs); opened from Settings › Updates
extraResources:
  - from: THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt
# The app can only be the app: no Node mode, no NODE_OPTIONS or --inspect, only the signed archive
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

win:
  executableName: On Page Media Downloader
nsis:
  # The installer id of 1.x (its Windows appId was electron-builder's default): 2.0 replaces 1.x instead of
  # installing beside it
  guid: 93349281-5920-511a-976c-fb254225cf65
  artifactName: ${name}-${version}-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always

mac:
  target:
    - dmg
  # Icon Composer's icon (scripts/app-icons.mjs), compiled by Xcode 26's actool: light, dark and tinted on
  # macOS 26, an icns for the older versions. yarn build:mac switches to build/icon.icns when actool is missing.
  icon: build/icon.icon
  identity: 'Dinside s.r.l.'
  hardenedRuntime: true
  entitlementsInherit: build/entitlements.mac.plist
  artifactName: ${name}-${version}-${arch}.${ext}

dmg:
  # The volume shows the icon drawn for every macOS, not actool's
  icon: build/icon.icns
  artifactName: ${name}-${version}-${arch}.${ext}
  sign: true

linux:
  # Drawn for Linux by scripts/app-icons.mjs, as build/icon.icns for macOS and build/icon.ico for Windows
  icon: build/icons
  target:
    - AppImage
    - deb
  maintainer: On Page
  category: Utility
  artifactName: ${name}-${version}-${arch}.${ext}

appImage:
  artifactName: ${name}-${version}-${arch}.${ext}

npmRebuild: false
